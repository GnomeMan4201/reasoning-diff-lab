<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/><rect width="1200" height="88" fill="#ffffff" stroke="#d8dee4"/>
<text x="48" y="38" font-family="system-ui" font-size="28" font-weight="700" fill="#1b1f23">Reasoning Diff Lab</text><text x="48" y="65" font-family="system-ui" font-size="15" fill="#5b6673">Local-first comparison of independently produced reasoning paths</text>
<g font-family="system-ui" font-size="15" font-weight="600"><rect x="48" y="108" width="220" height="46" rx="8" fill="#f4f6f8" stroke="#d8dee4"/><text x="68" y="137" fill="#1b1f23">1  Setup</text><rect x="282" y="108" width="260" height="46" rx="8" fill="#1a5fb4"/><text x="302" y="137" fill="#fff">2  Enter paths</text><rect x="556" y="108" width="220" height="46" rx="8" fill="#f4f6f8" stroke="#d8dee4"/><text x="576" y="137" fill="#1b1f23">3  Review</text><rect x="790" y="108" width="220" height="46" rx="8" fill="#f4f6f8" stroke="#d8dee4"/><text x="810" y="137" fill="#1b1f23">4  Results</text></g>
<text x="48" y="205" font-family="system-ui" font-size="28" font-weight="700" fill="#1b1f23">Analyst path entry</text><text x="48" y="235" font-family="system-ui" font-size="16" fill="#5b6673">Case 01 — Authentication outage</text>
<rect x="48" y="270" width="350" height="400" rx="10" fill="#f4f6f8" stroke="#d8dee4"/><text x="70" y="305" font-family="system-ui" font-size="21" font-weight="700">Shared evidence</text>
<g font-family="system-ui" font-size="14"><rect x="70" y="330" width="305" height="60" rx="8" fill="#fff" stroke="#d8dee4"/><text x="86" y="353" fill="#1a5fb4" font-weight="700">E1</text><text x="128" y="353">Failures began at 14:02 UTC</text><rect x="70" y="405" width="305" height="60" rx="8" fill="#fff" stroke="#d8dee4"/><text x="86" y="428" fill="#1a5fb4" font-weight="700">E2</text><text x="128" y="428">Configuration deployed at 14:01</text><rect x="70" y="480" width="305" height="60" rx="8" fill="#fff" stroke="#d8dee4"/><text x="86" y="503" fill="#1a5fb4" font-weight="700">E3</text><text x="128" y="503">Unexpected issuer error</text><rect x="70" y="555" width="305" height="60" rx="8" fill="#fff" stroke="#d8dee4"/><text x="86" y="578" fill="#1a5fb4" font-weight="700">E4</text><text x="128" y="578">Rollback restored service</text></g>
<text x="440" y="295" font-family="system-ui" font-size="21" font-weight="700">Add a reasoning unit</text><text x="440" y="335" font-family="system-ui" font-size="14" font-weight="700">Type</text><rect x="440" y="350" width="250" height="48" rx="8" fill="#fff" stroke="#d8dee4"/><text x="458" y="380" font-family="system-ui" font-size="16">Inference</text><text x="720" y="335" font-family="system-ui" font-size="14" font-weight="700">Confidence</text><rect x="720" y="350" width="190" height="48" rx="8" fill="#fff" stroke="#d8dee4"/><text x="738" y="380" font-family="system-ui" font-size="16">Moderate</text>
<text x="440" y="435" font-family="system-ui" font-size="14" font-weight="700">Proposition</text><rect x="440" y="450" width="710" height="105" rx="8" fill="#fff" stroke="#d8dee4"/><text x="460" y="485" font-family="system-ui" font-size="17">The deployment introduced an issuer mismatch that</text><text x="460" y="514" font-family="system-ui" font-size="17">caused authentication failures.</text>
<text x="440" y="590" font-family="system-ui" font-size="14" font-weight="700">Depends on</text><g font-family="system-ui" font-size="13"><rect x="440" y="607" width="170" height="36" rx="18" fill="#f4f6f8" stroke="#d8dee4"/><text x="455" y="630">✓ E2 deployment</text><rect x="622" y="607" width="170" height="36" rx="18" fill="#f4f6f8" stroke="#d8dee4"/><text x="637" y="630">✓ E3 issuer error</text><rect x="804" y="607" width="170" height="36" rx="18" fill="#f4f6f8" stroke="#d8dee4"/><text x="819" y="630">✓ U1 timing link</text></g><rect x="1010" y="600" width="140" height="48" rx="8" fill="#1a5fb4"/><text x="1080" y="631" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="700" fill="#fff">Save unit</text>
</svg>