name: Verify

on:
  push:
    branches: [main, "release/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Validate lockfile install
        run: npm ci
      - name: Verify tests, build, and built artifact
        run: npm run verify
